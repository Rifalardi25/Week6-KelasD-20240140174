<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexStore - Ulasan Produk</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

    <nav>
        <a href="index.html">Katalog</a>
        <a href="form.html" aria-current="page">Ulasan</a>
    </nav>

    <header>
        <h1>NexStore Review</h1>
        <p>Bagikan Pengalaman Anda Bersama Kami</p>
    </header>

    <main>
        <section class="section-form">
            <h2>Beri Ulasan Produk</h2>
            <form id="reviewForm" novalidate>
                <div class="form-group">
                    <label for="namaPembuat">Nama Anda</label>
                    <input type="text" id="namaPembuat" placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label for="ratingProduk">Rating Produk (1-5)</label>
                    <input type="number" id="ratingProduk" min="1" max="5" placeholder="Contoh: 5">
                </div>
                <div class="form-group">
                    <label for="ulasanTeks">Pesan Ulasan</label>
                    <textarea id="ulasanTeks" rows="5" placeholder="Bagaimana pendapat Anda mengenai produk ini?"></textarea>
                </div>
                <button type="submit">Kirim Ulasan</button>
            </form>
            <div id="feedback-msg"></div>
        </section>
    </main>

    <script src="js/form.js"></script>
</body>
</html>
